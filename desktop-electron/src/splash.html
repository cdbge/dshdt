<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Desktop 正在启动…</title>
<!--
  启动页（splash）：壳在**宿主就绪之前**就先显示这一页。
  为什么要它：宿主（dsh web）启动要 10~16 秒，而窗口原先要等它就绪才创建 ——
  那十几秒屏幕上什么都没有，用户感觉是"双击没反应"（2026-09-17 实测：进程 3.5s + 宿主 16s）。
  这一页是自包含的（无外链资源，只读地探一下本机 admin 端口），用 file:// 装载，不依赖 admin 服务。
  就绪后壳会 loadURL 切到真实页面；这里只管"让人知道它在启动"，不假装进度。
-->
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9f0; --dim:#8b93a5; --accent:#5b7cff; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;
         display:flex; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none; }
  .card { display:flex; flex-direction:column; align-items:center; gap:14px; padding:28px 34px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { width:30px; height:30px; border-radius:7px; }
  .wordmark { font-size:15px; letter-spacing:.14em; font-weight:700; }
  .wordmark span { font-weight:400; color:var(--dim); letter-spacing:.22em; margin-left:6px; }
  .ring { width:44px; height:44px; border-radius:50%; border:3px solid var(--line);
          border-top-color:var(--accent); animation:spin 900ms linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .msg { color:var(--dim); font-size:13px; }
  .elapsed { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .tips { color:var(--dim); font-size:12px; max-width:460px; text-align:center; line-height:1.7; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="icon.ico" alt="" onerror="this.style.display='none'">
      <div class="wordmark">DEEPS<span>SEEK</span></div>
    </div>
    <div class="ring"></div>
    <div class="msg" id="msg">正在启动后台服务（dsh web）…</div>
    <div class="elapsed" id="elapsed">已等待 0 秒</div>
    <div class="tips" id="tips">首次启动或刚更新过会比较慢（要校验依赖树），之后通常在 10 秒内。</div>
  </div>
<script>
(function () {
  var t0 = Date.now();
  var msg = document.getElementById('msg');
  var elapsed = document.getElementById('elapsed');
  var stage = '正在启动后台服务（dsh web）…';
  function tick() {
    var s = Math.round((Date.now() - t0) / 1000);
    elapsed.textContent = '已等待 ' + s + ' 秒';
    // 只报"阶段"，不编进度条：阶段来自壳真实走到哪一步（/api/status 只读）
    fetch('http://127.0.0.1:25439/api/status', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.ok && j.ready) stage = '后台已就绪，正在装载界面…';
        else if (j && j.ok) stage = '后台进程已拉起，正在等待就绪…';
        msg.textContent = stage;
      })
      .catch(function () { /* 壳还没监听：继续显示上一阶段 */ });
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
