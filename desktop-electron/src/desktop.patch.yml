# 桌面形态层（评审稿 2.5）：只动行 config、不改行 id；DSH 零改动。
# 注意：按 id 定位的 config 是整体替换语义，需带全该行的关键键。
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts
# 壳设置 section：注册进 DSH 自带设置面板（settings.section 插槽），
# 包为 dsh-desktop-ui（dsh.client 元数据由 modules 插件扫描供给浏览器）。
- insert:
    - id: dsh-desktop-ui
      name: dsh-desktop-ui
