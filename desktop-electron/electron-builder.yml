# electron-builder 配置
# 关键点：vendor/profile 走 extraResources 放 asar 外——RUN_AS_NODE 子进程读的是普通文件系统路径；
#         *.node 与 @img 平台二进制必须在 asarUnpack（asar 内无法被系统加载器读取）。
# 平台矩阵：Windows=NSIS(x64)、Linux=AppImage+deb(x64)。
# 注意：vendor 树必须是**目标平台**构建出来的（见 build-host.mjs 的 --os/--cpu），否则装上也起不来。
appId: com.deepseek.dsh-desktop
productName: DSH Desktop
directories:
  output: dist
  buildResources: build

files:
  - src/**
  - VERSION
  - package.json

asar: true
asarUnpack:
  - "**/*.node"
  - "**/node_modules/@img/**"

# 打包后立刻校验 **asar 里那份代码**能不能被解析。
# 为什么必须挂在打包器上（2026-09-16 事故）：我在改 `vendor-build.mjs` 时写坏了一处语法，
# 离线门禁当场抓到并修好了，但那一瞬间恰好有一次打包在跑 ⇒ 产出的安装包**双击即崩**：
#   `SyntaxError: Unexpected identifier 'lockDir'`（`main.mjs` 在模块加载期就 import 了它）。
# 根因是**所有门禁查的都是仓库 src/，而用户加载的是 asar 里那一份**——两者之间隔着一个"打包时刻"。
# 挂在 afterPack 上，等于"产物一出来就查它自己"，不给这个缝隙留时间。
afterPack: scripts/check-packaged-asar.mjs

extraResources:
  # from 必须是 vendor（而不是 vendor/profile）：app-builder-lib 的 copy filter 硬编码排除
  # 拷贝根一级的 node_modules（util/filter.js），vendor/profile 的 node_modules 恰在根级会被整棵跳过。
  #
  # ⚠️ 这份 vendor 在 Linux 上只是**种子**（决策 D8）：首启会被拷到用户数据目录，
  #    之后所有换树都在那边发生 —— AppImage 的 resources 是只读挂载。见 src/vendor-home.mjs。
  - from: vendor
    to: vendor
  - from: src/desktop.patch.yml
    to: desktop.patch.yml
  # 市场目录（随包样例）。放在 asar 外与 desktop.patch.yml 同理：壳用普通文件系统路径读它，
  # 且将来"用户目录覆盖 > 包内样例"的两级回退要能对着一个确定的绝对路径做判断。
  - from: src/market-catalog.json
    to: market-catalog.json
  # 图标：.ico 给 Windows，.png 给 Linux（含托盘）。
  # 两份都由 `scripts/gen-icon.mjs` 生成（纯 Node，不依赖 Electron）。
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png

# dsh:// 深链：Linux 写进 .desktop 的 MimeType；Windows 侧由壳运行时调
# setAsDefaultProtocolClient 写注册表，与这里并存不冲突。
protocols:
  - name: DSH Desktop
    schemes:
      - dsh

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  differentialPackage: true
  shortcutName: DSH Desktop
  artifactName: DSHDesktop-Setup-${version}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # electron-builder 的 linux.icon 只认 png 目录或单个 ≥512 的 png（.ico 会被拒）
  icon: build/icons
  category: Development
  synopsis: DeepSeek Harness 桌面壳
  description: |
    DSH Desktop 把 DeepSeek Harness 的 Web 界面托管成桌面应用：托盘常驻、多窗口复用、
    壁纸皮肤、一键更新。DSH 运行时随包自带，无需另行安装。
  maintainer: dshdt <noreply@example.com>
  desktop:
    entry:
      MimeType: x-scheme-handler/dsh;
      StartupWMClass: DSH Desktop
  artifactName: DSHDesktop-${version}-${arch}.${ext}

deb:
  # bubblewrap：DSH 的 Linux 沙箱后端（缺失时 agent 命令会被 fail-closed 拒绝）
  recommends:
    - bubblewrap



# 热更新（electron-updater）的**前提**：只有配了 provider，electron-builder 才会产出
#   ① 打进包里的 `resources/app-update.yml` ② 与安装包同级的 `latest.yml` / `latest-linux.yml`。
# 少了它，壳里的 `HAS_UPDATE_SOURCE` 永远是 false、「检查更新」永远是灰的（静默失效，不是报错）。
#
# 分工：
#   · 本地打包**一律不发布**（npm scripts 里都带 `--publish never`，避免误发到线上）；
#   · CI 里 `release.yml` 的 release job 负责一次性建 Release 并上传安装包 + `latest*.yml`。
#
# 各平台自更新的条件（不满足时壳会明确降级，而不是报错）：
#   · Windows：NSIS 安装版（`differentialPackage: true` → 带 blockmap，可差分下载）
#   · Linux  ：**仅 AppImage**（electron-updater 靠替换 AppImage 文件自更新；deb 装到 /opt，属只读且无替换路径）
publish:
  provider: github
  owner: cdbge
  repo: dshdt
