# Release — 三平台构建（Windows / Linux / macOS）
#
# 触发：
#   · push tag `v*`            → 构建 + 全部门禁 + 打包 + 建 Release（发布路径）
#     ⚠️ macOS job 是 `continue-on-error`（未签名/未公证），**不阻塞发布**；release job 只等 Windows 与 Linux。
#   · workflow_dispatch        → 手动跑一次（不推 tag 也能验证三平台能不能构建）
#
# 三个 job 各自在**目标平台原生**构建（vendor 树里的 koffi / node-pty / sharp / node-addon-system
# 都是预编译二进制，装错平台宿主在 import 期就崩）。交叉构建只在开发态省事。
#
# ⚠️ macOS 例外：`--mac dmg zip --arm64 --x64` 会把**同一棵 vendor 树**打进两个架构的 .app，
#    而 npm install 一次只能按一个 `--cpu` 解析可选依赖 ⇒ 必须用 build-mac-universal.mjs
#    产出"两个架构平台包并存"的树（见该脚本头部注释）。少了这一步，x64 的 .app 装上也起不来。
#
# 签名（可选，未配置则出未签名包）：
#   Windows：WINDOWS_CERT_PFX + WINDOWS_CERT_PASSWORD → 走 electron-builder 的 signtool 流程
#   macOS  ：CSC_LINK + CSC_KEY_PASSWORD（Developer ID）+ APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID（公证）
#   未配置时 macOS 会 ad-hoc 签名，dmg 能装能跑，但"下载自互联网"会触发 Gatekeeper。
name: Release

# 热更新（electron-updater）读的是 **Release 资产**里的 latest*.yml：
# 所以这个工作流在 tag 推送时必须真的建一个 Release（光上传 workflow artifact 是取不到的，
# 那些产物会过期且没有稳定 URL）。建 Release 需要写权限。
permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ── 离线门禁（与平台无关，但三平台各跑一遍才能证明"平台相关代码在该平台也成立"） ──
  self-test:
    name: 离线自检（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json
      - run: npm ci
      # 数字由 `npm run test:suite` 打印为准；这里不写死断言数，免得每次加断言都要改 workflow
      #
      # ⚠️ 失败时把 FAIL 行打成**注解**（2026-09-19 实测的必要性）：job 日志下载要仓库 admin 权限
      # （API 返回 403 "Must have admin rights"），而注解在 check-run 上**公开可读**
      # （`GET /repos/{owner}/{repo}/check-runs/{id}/annotations`）——否则在别的机器上根本看不到
      # 到底是哪条判据红了。`shell: bash` 三平台都有（Windows runner 自带 Git Bash），
      # 所以这段不依赖 POSIX/pwsh 的差异。
      - name: 离线自检（全部套件）
        shell: bash
        run: |
          set +e
          node scripts/test-suite.mjs 2>&1 | tee "$RUNNER_TEMP/suite.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # 只把 FAIL/错误行抬成注解（head 限流：注解太多会被 UI 折叠）
            grep -E '(^|[[:space:]])(FAIL|✗)|Error:|错误' "$RUNNER_TEMP/suite.log" | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      # 版本锁是"三平台包内容一致"的前提（钉死传递依赖版本），改 DSH 版本时要人工重生成。
      # 这条**联网**跑 `npm ci --dry-run`，npm 自己校验锁与 manifest 是否同一套 —— 任何不一致都拒绝。
      # 放在打包 job 之前：锁不对，三平台产物就不该被生产出来。
      - name: 门禁：版本锁与 manifest 一致（strict，联网）
        run: node scripts/check-vendor-lock.mjs --strict

  windows:
    name: Windows（NSIS x64）
    needs: self-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json
      - run: npm ci

      - name: 构建 vendor/profile（自包含运行时 + 平台包门禁 + ABI 门禁）
        run: node scripts/build-host.mjs

      - name: 门禁：vendor 树静态体检（平台包齐备、无别平台残留）
        run: node scripts/verify-cross-tree.mjs --dir vendor

      - name: 门禁：开发态 smoke（72 断言）
        env:
          DSH_SMOKE: '1'
        run: node scripts/smoke.mjs

      - name: 打包 NSIS
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: npx electron-builder --win nsis --publish never

      # 显式再跑一遍（`afterPack` 钩子已经查过一次）。留着是为了：① 日志里一眼能看到这项结论；
      # ② 万一钩子因为 electron-builder 版本变化没被调用，这一步仍能兜住
      #    （2026-09-16 的坏包事故就是"打包时刻源文件恰好是坏的"，产物出来后再没人看过它）。
      - name: 门禁：打包产物里的代码必须能解析（asar 逐个源码文件）
        run: node scripts/check-packaged-asar.mjs dist/win-unpacked

      - name: 门禁：打包产物 smoke（win-unpacked 复跑）
        shell: pwsh
        env:
          DSH_SMOKE: '1'
        run: |
          $env:DSH_APP_DATA = Join-Path $env:RUNNER_TEMP 'dsh-pkg-appdata'
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'dsh-pkg-home'
          $log = Join-Path $env:RUNNER_TEMP 'packaged-smoke.log'
          # 打包态退出码不可信，所以以输出里的 PASS 计数为准；退出码不作为唯一判据
          & '.\dist\win-unpacked\DSH Desktop.exe' --smoke --disable-gpu 2>&1 | Tee-Object -FilePath $log
          $text = Get-Content $log -Raw
          if ($text -notmatch '([0-9]+)/\1 PASS' -and $text -notmatch 'SMOKE OK') {
            throw "packaged smoke 未输出 PASS 计数"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            desktop-electron/dist/*.exe
            desktop-electron/dist/*.blockmap
            # 热更新元数据（含 sha512 与文件名），必须随 Release 一起发
            desktop-electron/dist/latest*.yml

  linux:
    name: Linux（AppImage + deb x64）
    needs: self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json

      # deb 打包要 fakeroot/rpm（electron-builder 用它们生成控制脚本与 rpm 元数据）；
      # xvfb 用于无显示环境下跑 Electron（冒烟门禁）。
      - name: 安装打包与冒烟依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools fakeroot rpm xvfb libfuse2

      - run: npm ci

      - name: 生成图标（ico + png + linux 图标目录；icns 只能在 macOS 生成）
        run: npx electron scripts/gen-icon.mjs

      - name: 构建 vendor/profile（默认本机平台 = linux-x64）
        run: node scripts/build-host.mjs

      - name: 门禁：vendor 树静态体检（平台包齐备、无别平台残留）
        run: node scripts/verify-cross-tree.mjs --dir vendor

      - name: 门禁：开发态 smoke（xvfb 下跑 Electron）
        env:
          DSH_SMOKE: '1'
        run: xvfb-run -a node scripts/smoke.mjs

      - name: 打包 AppImage + deb
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npx electron-builder --linux AppImage deb --publish never

      - name: 门禁：打包产物里的代码必须能解析（asar 逐个源码文件）
        run: node scripts/check-packaged-asar.mjs dist/linux-unpacked

      - name: 门禁：打包产物 smoke（linux-unpacked 复跑）
        env:
          DSH_SMOKE: '1'
        run: |
          export DSH_APP_DATA="$RUNNER_TEMP/dsh-pkg-appdata"
          export DSH_HOME="$RUNNER_TEMP/dsh-pkg-home"
          BIN="$(ls -d dist/linux-unpacked/* | head -1)"
          echo "packaged binary: $BIN"
          # 打包态退出码不可信，所以以输出里的 PASS 计数为准，并保留完整日志
          set +e
          xvfb-run -a "$BIN" --smoke --disable-gpu 2>&1 | tee "$RUNNER_TEMP/packaged-smoke.log"
          set -e
          if ! grep -Eq "([0-9]+)/\1 PASS" "$RUNNER_TEMP/packaged-smoke.log" && ! grep -q "SMOKE OK" "$RUNNER_TEMP/packaged-smoke.log"; then
            echo "::error::packaged smoke 未输出 PASS 计数"
            tail -50 "$RUNNER_TEMP/packaged-smoke.log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: |
            desktop-electron/dist/*.AppImage
            desktop-electron/dist/*.deb
            desktop-electron/dist/latest*.yml

  macos:
    name: macOS（dmg + zip，arm64 + x64）
    needs: self-test
    # 不阻塞发布：macOS 目前**未在真机验证**（既没签名也没公证），失败不该拦住 Windows/Linux 出包。
    # 保留这个 job 是为了让「能不能构建」这件事持续可见，而不是靠一句「应该能」。
    continue-on-error: true
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json
      - run: npm ci

      - name: 生成图标（macOS 上会额外产出 icon.icns；失败即停，否则打包会缺图标）
        run: |
          npx electron scripts/gen-icon.mjs
          test -s build/icon.icns || { echo "::error::icon.icns 未生成"; exit 1; }

      - name: 构建 vendor/profile（**双架构一棵树**：arm64 + x64 平台包并存）
        run: node scripts/build-mac-universal.mjs --host arm64 --add x64

      - name: 门禁：vendor 树静态体检（平台包齐备、无别平台残留）
        run: node scripts/verify-cross-tree.mjs --dir vendor

      - name: 门禁：开发态 smoke
        env:
          DSH_SMOKE: '1'
        run: node scripts/smoke.mjs

      - name: 打包 dmg + zip（arm64 与 x64）
        env:
          # 未配证书时不要自动去找钥匙串里的身份（否则签名步骤会因为半个身份而失败）
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never

      # 两个架构各一个 .app：两个都要查（它们是同一份源码、但打包路径不同）
      - name: 门禁：打包产物里的代码必须能解析（asar 逐个源码文件）
        run: node scripts/check-packaged-asar.mjs dist/mac-arm64 dist/mac

      - name: 门禁：打包产物 smoke（mac 目录下的 .app）
        env:
          DSH_SMOKE: '1'
        run: |
          export DSH_APP_DATA="$RUNNER_TEMP/dsh-pkg-appdata"
          export DSH_HOME="$RUNNER_TEMP/dsh-pkg-home"
          APP="$(ls -d dist/mac*/*.app | head -1)"
          echo "packaged app: $APP"
          set +e
          "$APP/Contents/MacOS/DSH Desktop" --smoke --disable-gpu 2>&1 | tee "$RUNNER_TEMP/packaged-smoke.log"
          set -e
          if ! grep -Eq "([0-9]+)/\1 PASS" "$RUNNER_TEMP/packaged-smoke.log" && ! grep -q "SMOKE OK" "$RUNNER_TEMP/packaged-smoke.log"; then
            echo "::error::packaged smoke 未输出 PASS 计数"
            tail -50 "$RUNNER_TEMP/packaged-smoke.log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos
          path: |
            desktop-electron/dist/*.dmg
            desktop-electron/dist/*.zip
            desktop-electron/dist/latest*.yml

  # ── 建 Release 并挂上安装包 + 热更新元数据 ─────────────────────────────────────
  #
  # 为什么单独一个 job、而不是让三个打包 job 各自 publish：同一 tag 只能有一个 Release，
  # 三平台并发创建会互相竞态。这里等三个平台都产完，**一次性**建好并挂齐资产。
  # 只在 tag 推送时跑——workflow_dispatch 的语义是"验证能不能构建"，不该动线上发布。
  release:
    name: 发布 Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 将发布的资产
        run: ls -la dist

      # 缺了 latest*.yml 就没有"新版本在哪"的信息：装了旧版的用户永远发现不了更新。
      # 这类失效是静默的（壳只会显示"已是最新"），所以在这里当硬失败挡住。
      - name: 门禁：热更新元数据齐备
        run: |
          missing=""
          # macOS 未验证、不阻塞：latest-mac.yml 缺失不算失败（有则一并挂上去）
          for f in latest.yml latest-linux.yml; do
            [ -s "dist/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少热更新元数据：$missing（检查 electron-builder.yml 的 publish.provider）"
            exit 1
          fi
          echo "热更新元数据齐备：latest.yml / latest-linux.yml"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          generate_release_notes: true
          fail_on_unmatched_files: false