# Release — 两平台构建（Windows / Linux），tag 推送时建 Release
# 签名可选：Windows 用 WINDOWS_CERT_PFX/PASSWORD，未配置则出未签名包。
name: Release

permissions:
  contents: write

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 离线门禁：与平台无关，但两平台各跑一遍才能证明平台相关代码在该平台也成立
  self-test:
    name: 离线自检（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json
      - run: npm ci
      # 失败时把 FAIL 行抬成 check-run 注解：job 日志要仓库 admin 才能下载，注解公开可读
      - name: 离线自检（全部套件）
        shell: bash
        run: |
          set +e
          node scripts/test-suite.mjs 2>&1 | tee "$RUNNER_TEMP/suite.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E '(^|[[:space:]])(FAIL|✗)|Error:|错误' "$RUNNER_TEMP/suite.log" | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      - name: 门禁：版本锁与 manifest 一致（strict，联网）
        run: node scripts/check-vendor-lock.mjs --strict

      - name: 门禁：热更新组件清单与源码一致
        run: node scripts/gen-components.mjs --check

      # tag / package.json / VERSION 三处版本必须一致，否则 Release 里的包与标签版本号对不上
      - name: 门禁：标签与版本号一致（tag = package.json = VERSION）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          pkg="v$(node -p "require('./package.json').version")"
          file="v$(tr -d '\r\n' < VERSION)"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$file" ]; then
            echo "::error::标签 $tag 与 package.json($pkg) / VERSION($file) 不一致"
            exit 1
          fi
          echo "标签与版本一致：$tag"

  windows:
    name: Windows（NSIS x64）
    needs: self-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json
      - run: npm ci

      - name: 构建 vendor/profile（自包含运行时 + 平台包门禁 + ABI 门禁）
        run: node scripts/build-host.mjs

      - name: 门禁：vendor 树静态体检（平台包齐备、无别平台残留）
        run: node scripts/verify-cross-tree.mjs --dir vendor

      - name: 生成图标（ico + png + icons，纯 Node）
        shell: bash
        run: bash scripts/ci-run.sh "生成图标" node scripts/gen-icon.mjs

      - name: 门禁：开发态 smoke（72 断言）
        shell: bash
        env:
          DSH_SMOKE: '1'
        run: bash scripts/ci-run.sh "开发态 smoke" node scripts/smoke.mjs

      - name: 打包 NSIS
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: bash
        run: bash scripts/ci-run.sh "打包 NSIS" npx electron-builder --win nsis --publish never

      - name: 门禁：打包产物里的代码必须能解析（asar 逐个源码文件）
        shell: bash
        run: bash scripts/ci-run.sh "asar 解析门禁（win-unpacked）" node scripts/check-packaged-asar.mjs dist/win-unpacked

      - name: 门禁：打包产物 smoke（win-unpacked 复跑）
        shell: pwsh
        env:
          DSH_SMOKE: '1'
        run: |
          $env:DSH_APP_DATA = Join-Path $env:RUNNER_TEMP 'dsh-pkg-appdata'
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'dsh-pkg-home'
          $log = Join-Path $env:RUNNER_TEMP 'packaged-smoke.log'
          # 打包态退出码不可信，以输出里的 PASS 计数为准
          & '.\dist\win-unpacked\DSH Desktop.exe' --smoke --disable-gpu 2>&1 | Tee-Object -FilePath $log
          $text = Get-Content $log -Raw
          if ($text -notmatch '([0-9]+)/\1 PASS' -and $text -notmatch 'SMOKE OK') {
            Get-Content $log -Tail 15 | ForEach-Object { Write-Output "::error::$_" }
            throw "packaged smoke 未输出 PASS 计数"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            desktop-electron/dist/*.exe
            desktop-electron/dist/*.blockmap
            desktop-electron/dist/latest*.yml

  linux:
    name: Linux（AppImage + deb x64）
    needs: self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package-lock.json

      # fakeroot/rpm 供 deb 打包，xvfb 供无显示环境下的 Electron 冒烟
      - name: 安装打包与冒烟依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools fakeroot rpm xvfb libfuse2

      - run: npm ci

      - name: 生成图标（ico + png + linux 图标目录）
        shell: bash
        run: bash scripts/ci-run.sh "生成图标" node scripts/gen-icon.mjs

      - name: 构建 vendor/profile（默认本机平台 = linux-x64）
        run: node scripts/build-host.mjs

      - name: 门禁：vendor 树静态体检（平台包齐备、无别平台残留）
        run: node scripts/verify-cross-tree.mjs --dir vendor

      - name: 门禁：开发态 smoke（xvfb 下跑 Electron）
        shell: bash
        env:
          DSH_SMOKE: '1'
        run: xvfb-run -a bash scripts/ci-run.sh "开发态 smoke" node scripts/smoke.mjs

      - name: 打包 AppImage + deb
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: bash scripts/ci-run.sh "打包 AppImage + deb" npx electron-builder --linux AppImage deb --publish never

      - name: 门禁：打包产物里的代码必须能解析（asar 逐个源码文件）
        shell: bash
        run: bash scripts/ci-run.sh "asar 解析门禁（linux-unpacked）" node scripts/check-packaged-asar.mjs dist/linux-unpacked

      - name: 门禁：打包产物 smoke（linux-unpacked 复跑）
        env:
          DSH_SMOKE: '1'
        run: |
          export DSH_APP_DATA="$RUNNER_TEMP/dsh-pkg-appdata"
          export DSH_HOME="$RUNNER_TEMP/dsh-pkg-home"
          # 必须点名可执行文件：目录里按名字排序排在 dsh-desktop 前面的是 chrome_*.pak 之类的数据文件
          BIN="dist/linux-unpacked/dsh-desktop"
          [ -x "$BIN" ] || BIN="$(find dist/linux-unpacked -maxdepth 1 -type f -perm -u+x ! -name 'chrome*' ! -name '*.so*' | head -1)"
          [ -x "$BIN" ] || { echo "::error::找不到可执行文件（dist/linux-unpacked 内容如下）"; ls -la dist/linux-unpacked; exit 1; }
          echo "packaged binary: $BIN"
          # --no-sandbox：产物里的 chrome-sandbox 是 0755，Ubuntu 24.04+ 又限制用户命名空间
          set +e
          xvfb-run -a "$BIN" --smoke --disable-gpu --no-sandbox 2>&1 | tee "$RUNNER_TEMP/packaged-smoke.log"
          set -e
          if ! grep -Eq "([0-9]+)/\1 PASS" "$RUNNER_TEMP/packaged-smoke.log" && ! grep -q "SMOKE OK" "$RUNNER_TEMP/packaged-smoke.log"; then
            echo "::error::packaged smoke 未输出 PASS 计数"
            tail -15 "$RUNNER_TEMP/packaged-smoke.log" | while IFS= read -r l; do echo "::error::$l"; done
            tail -50 "$RUNNER_TEMP/packaged-smoke.log"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux
          path: |
            desktop-electron/dist/*.AppImage
            desktop-electron/dist/*.deb
            desktop-electron/dist/latest*.yml

  release:
    name: 发布 Release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 将发布的资产
        run: ls -la dist

      # 缺 latest*.yml 就没有"新版本在哪"的信息，且失效是静默的（壳只显示"已是最新"）
      - name: 门禁：热更新元数据齐备
        run: |
          missing=""
          for f in latest.yml latest-linux.yml; do
            [ -s "dist/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少热更新元数据：$missing（检查 electron-builder.yml 的 publish.provider）"
            exit 1
          fi
          echo "热更新元数据齐备：latest.yml / latest-linux.yml"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          generate_release_notes: true
          fail_on_unmatched_files: false
