# 清单门禁 —— main 分支每次推送都查，防止热更新清单与版本号漂移
name: 清单门禁

on:
  push:
    branches: [main]
    paths:
      - 'desktop-electron/**'
      - '.github/workflows/manifest-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: 热更新清单与版本一致性
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 两个脚本都是纯 Node 零依赖，不需要 npm ci
      - name: 门禁：热更新清单与源码一致
        run: node scripts/gen-components.mjs --check
      - name: 门禁：VERSION 与 package.json 版本一致
        shell: bash
        run: |
          a="$(tr -d '\r\n' < VERSION)"
          b="$(node -p "require('./package.json').version")"
          if [ "$a" != "$b" ]; then
            echo "::error::VERSION($a) 与 package.json($b) 不一致"
            exit 1
          fi
          echo "版本一致：$a"
